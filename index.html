<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
</head>
<body>
  <main>
    <h1>Todo</h1>
    <form id="todo-form">
      <label for="task">New task</label>
      <input id="task" name="task" type="text" autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <fieldset>
      <legend>Show tasks</legend>
      <label><input type="radio" name="filter" value="all" checked> All</label>
      <label><input type="radio" name="filter" value="active"> Active</label>
      <label><input type="radio" name="filter" value="completed"> Completed</label>
    </fieldset>
    <p id="count" aria-live="polite"></p>
    <ul id="tasks" aria-label="Tasks"></ul>
    <p id="empty" hidden>No tasks match this filter.</p>
    <p><a href="calculator.html">Spaghetti calculator</a></p>
  </main>
  <script src="todo.js"></script>
  <script>
    var todo = createTodoApp(window.localStorage);
    var form = document.getElementById('todo-form');
    var input = document.getElementById('task');
    var list = document.getElementById('tasks');
    var count = document.getElementById('count');
    var empty = document.getElementById('empty');
    var filter = 'all';

    function render() {
      var view = todo.getView(filter);
      count.textContent = view.incompleteCount + ' incomplete';
      empty.hidden = view.rows.length !== 0;
      list.replaceChildren();
      view.rows.forEach(function (task) {
        var item = document.createElement('li');
        var label = document.createElement('label');
        var checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.completed;
        checkbox.addEventListener('change', function () {
          todo.setCompleted(task.index, checkbox.checked);
          render();
        });
        label.append(checkbox, document.createTextNode(' ' + task.text));
        var edit = document.createElement('button');
        edit.type = 'button';
        edit.textContent = 'Edit';
        edit.setAttribute('aria-label', 'Edit ' + task.text);
        edit.addEventListener('click', function () {
          var editor = document.createElement('form');
          var draft = document.createElement('input');
          draft.type = 'text';
          draft.value = task.text;
          draft.setAttribute('aria-label', 'Task name');
          var save = document.createElement('button');
          save.type = 'submit';
          save.textContent = 'Save';
          var cancel = document.createElement('button');
          cancel.type = 'button';
          cancel.textContent = 'Cancel';
          cancel.addEventListener('click', render);
          editor.addEventListener('submit', function (event) {
            event.preventDefault();
            todo.rename(task.index, draft.value);
            render();
          });
          editor.append(draft, ' ', save, ' ', cancel);
          item.replaceChildren(editor);
          draft.focus();
        });
        var remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = 'Remove';
        remove.setAttribute('aria-label', 'Remove ' + task.text);
        remove.addEventListener('click', function () {
          todo.remove(task.index);
          render();
        });
        item.append(label, ' ', edit, ' ', remove);
        list.append(item);
      });
    }

    document.querySelectorAll('input[name="filter"]').forEach(function (control) {
      control.addEventListener('change', function () {
        filter = control.value;
        render();
      });
    });
    form.addEventListener('submit', function (event) {
      event.preventDefault();
      if (todo.add(input.value)) {
        input.value = '';
        render();
      }
    });
    render();
  </script>
</body>
</html>
